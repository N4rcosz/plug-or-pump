<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,'Segoe UI',sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Plug Or Pump</title>
<meta name="author" content="N4rcos">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f4f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0f0f">
<!-- Home-screen app: these files sit next to index.html on the web host (see site/); inside Claude they are simply not found. -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Plug Or Pump">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Layout: instrument-cluster header with the savings figure, cost race chart, then entry form and a month-grouped logbook like the spreadsheet.
   Look: the device's own system font, soft cards on a quiet background, press feedback on every control. */
:root {
  --bg: #f2f4f3;
  --surface: #ffffff;
  --ink: #121a19;
  --muted: #5f6d6b;
  --line: #e1e6e5;
  --volt: #0a8574;        /* electricity */
  --volt-soft: #dcf1ed;
  --fuel: #b86e12;        /* petrol / Super */
  --fuel-soft: #f7ead6;
  --good: #1d8248;
  --bad: #c0392b;
  --focus: #0a66d8;
  --spark: #f2b705;       /* lightning bolt in the start animation */
  --shadow: 0 1px 2px rgba(16, 24, 23, .05), 0 6px 20px rgba(16, 24, 23, .06);
  --radius: 18px;
  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --f-display: system-ui, -apple-system, "Segoe UI Variable Display", "Segoe UI", Roboto, sans-serif;
  --f-body: system-ui, -apple-system, "Segoe UI Variable Text", "Segoe UI", Roboto, sans-serif;
  --f-mono: var(--f-body); /* numbers use tabular figures of the system font */
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0f0f; --surface: #151b1b; --ink: #e8efed; --muted: #93a3a0; --line: #253030;
    --volt: #3ccbb5; --volt-soft: #133631; --fuel: #f2a649; --fuel-soft: #3a2912;
    --good: #4fc77f; --bad: #f0806b; --focus: #6aa8ff; --spark: #ffd84a; color-scheme: dark;
    --shadow: 0 0 0 1px var(--line);
  }
}
:root[data-theme="dark"] {
  --bg: #0b0f0f; --surface: #151b1b; --ink: #e8efed; --muted: #93a3a0; --line: #253030;
  --volt: #3ccbb5; --volt-soft: #133631; --fuel: #f2a649; --fuel-soft: #3a2912;
  --good: #4fc77f; --bad: #f0806b; --focus: #6aa8ff; --spark: #ffd84a; color-scheme: dark;
  --shadow: 0 0 0 1px var(--line);
}
* { box-sizing: border-box; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 48px;
}
.wrap { max-width: 1080px; margin: 0 auto; display: grid; gap: 22px; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
/* Sections are full width unless set to half in Settings; header, settings and car bar stay on top, the credit at the bottom. */
.wrap > * { grid-column: 1 / -1; min-width: 0; }
.wrap > .w-half { grid-column: auto; }
.wrap > header { order: -3; } .wrap > #prefs { order: -2; } .wrap > .carbar { order: -1; } .wrap > .credit { order: 999; }
@media (max-width: 760px) { .wrap > .w-half { grid-column: 1 / -1; } }
.wlist { display: grid; gap: 2px; }
.wrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 10px; padding: 3px 0; border-bottom: 1px solid var(--line); }
.wrow:last-child { border-bottom: 0; }
.wrow label { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.wrow input { width: 16px; height: 16px; accent-color: var(--volt); }
.wbtns { display: flex; align-items: center; gap: 4px; }
.wmove { color: var(--muted); font-weight: 700; }
.wmove:disabled { opacity: .3; cursor: default; }
.wsize { min-width: 7rem; }
.wsize[aria-pressed="true"] { border-color: var(--volt); background: var(--volt-soft); }
/* Tracking by size: big text tighter, small labels looser. */
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; margin: 0; text-wrap: balance; }
h1 { font-size: 2rem; line-height: 1.05; letter-spacing: -.025em; }
h2 { font-size: 1.25rem; letter-spacing: -.015em; }
h3 { font-size: 1.05rem; letter-spacing: -.01em; }
.num, td, .stat b, input { font-variant-numeric: tabular-nums; }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
button, input, select { font: inherit; color: inherit; }
/* Controls: no double-tap delay, and a long press doesn't select their text. */
button, select, .seg label, .checks label, .cmp-chips label, .map-check { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
/* iPhone zooms into inputs under 16px; keep them at 16px on touch screens. */
@media (pointer: coarse) { input:not([type="checkbox"]):not([type="radio"]):not([type="range"]), select:not(#carSel) { font-size: 16px; } }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

/* header */
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.title-sub { color: var(--muted); margin-top: 6px; }
.title-sub .v { color: var(--volt); font-weight: 600; }
.title-sub .f { color: var(--fuel); font-weight: 600; }
.hdr-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.status { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.dot.ok { background: var(--good); } .dot.warn { background: var(--fuel); }
.btn.icon { display: inline-flex; align-items: center; gap: 6px; }
.btn.icon svg { width: 16px; height: 16px; }
.btn[aria-expanded="true"] { background: var(--volt-soft); border-color: var(--volt); }

/* preferences */
.prefs { border-color: var(--volt); }
.prefs-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px 28px; }
.pref { display: grid; gap: 8px; align-content: start; min-width: 0; }
/* Segmented control: a quiet track with the chosen option raised, as on iOS. */
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 3px; border-radius: 12px; background: color-mix(in srgb, var(--ink) 7%, transparent); width: fit-content; max-width: 100%; }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 6px 14px; border-radius: 9px; font-weight: 500; transition: background-color 160ms ease, color 160ms ease, box-shadow 160ms ease; }
.seg input:checked + span { background: var(--surface); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
.seg input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: -2px; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; }
.checks label { display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 3px 0; }
.checks input { width: 16px; height: 16px; accent-color: var(--volt); }
.pref-note { font-size: .8rem; color: var(--muted); }
.pref-toggle { display: flex; align-items: center; gap: 6px; width: 100%; padding: 4px 0; border: 0; background: none; color: inherit; cursor: pointer; text-align: left; }
.pref-toggle svg { width: 14px; height: 14px; flex: none; color: var(--muted); transition: transform .2s ease; }
.pref-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
.pref-body { display: grid; gap: 8px; }
#prefs > .pref { border-top: 1px solid var(--line); padding-top: 10px; }
/* Group headings: Display & layout, Cars, Prices, Data & backup */
.pref-group { margin: 14px 0 0; padding-top: 12px; border-top: 2px solid var(--volt); font-size: 1.15rem; color: var(--ink); }
.panel-head + .pref-group { margin-top: 0; }
.pref-group + .pref { border-top: 0; padding-top: 0; }
@media (prefers-reduced-motion: reduce) { .pref-toggle svg { transition: none; } }
.carcolours { display: grid; gap: 6px; }
.ccrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
.ccrow:last-child { border-bottom: 0; }
.mini { display: inline-flex; width: 80px; height: 31px; flex: none; }
.ccrow .nm { font-weight: 600; min-width: 9rem; flex: 1 1 9rem; }
.formlook { display: inline-flex; align-items: center; gap: 8px; }

/* car look pickers */
.look-icon { display: inline-flex; width: 100%; height: 100%; padding: 2px; border: 1px solid transparent; border-radius: 8px; background: none; cursor: pointer; }
.look-icon[aria-expanded="true"] { border-color: var(--line); background: var(--bg); }
.look-icon svg { width: 100%; height: 100%; overflow: visible; }
.carimg { display: block; width: 100%; height: 100%; object-fit: contain; }
.carpic.drive img { animation: drive-in .9s cubic-bezier(.2, .7, .2, 1); }
.look-colour { display: inline-flex; width: 30px; height: 30px; padding: 3px; flex: none; border-radius: 50%; border: 1px solid var(--line); cursor: pointer;
  background: conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.look-colour .chip { flex: 1; border-radius: 50%; border: 2px solid var(--surface); }
.look-colour[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--volt); }
/* Popovers open from their button (below it, left-aligned) and settle quickly. */
.lookpop { position: fixed; z-index: 50; display: grid; gap: 10px; padding: 14px; max-width: calc(100vw - 16px);
  background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px rgba(0, 0, 0, .18);
  transform-origin: top left; transition: opacity 180ms var(--ease-out), transform 180ms var(--ease-out); }
@starting-style { .lookpop { opacity: 0; transform: scale(.96); } }
.pop-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; }
.shape-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; width: min(330px, calc(100vw - 42px)); }
.shape-opt { display: flex; height: 50px; padding: 6px 5px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); cursor: pointer; }
.shape-opt[aria-pressed="true"] { border-color: var(--volt); box-shadow: inset 0 0 0 1px var(--volt); background: var(--volt-soft); }
.shape-opt svg { width: 100%; height: 100%; overflow: visible; }
.wheel-disc { position: relative; justify-self: center; width: 180px; height: 180px; border-radius: 50%; cursor: crosshair; touch-action: none;
  background: radial-gradient(circle closest-side, #fff, rgba(255, 255, 255, 0)), conic-gradient(#f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
.wheel-shade { position: absolute; inset: 0; border-radius: 50%; background: #000; pointer-events: none; }
.wheel-dot { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0, 0, 0, .55); pointer-events: none; }
.wheel-row { display: flex; align-items: center; gap: 10px; width: 220px; max-width: 100%; }
.wheel-row input { flex: 1; min-width: 0; accent-color: var(--volt); }
.wheel-now { width: 26px; height: 26px; flex: none; border-radius: 50%; border: 1px solid var(--line); }
.ccrow .typesel { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); max-width: 100%; min-width: 0; }

/* car selector */
.carbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.carbar select { padding: 7px 12px; border: 0; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-family: var(--f-display); font-size: 1.15rem; font-weight: 650; letter-spacing: -.01em; max-width: 100%; min-width: 0; cursor: pointer; }
.carform { display: flex; flex-wrap: wrap; gap: 6px; }
.carform input { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; width: 14rem; max-width: 100%; }
.carform input.cap { width: 8rem; font-family: var(--f-mono); }
.carform select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.carpic { display: inline-flex; width: 112px; height: 42px; flex: none; }
.carpic svg { width: 100%; height: 100%; overflow: visible; }
.wheel { transform-box: fill-box; transform-origin: center; }
.carpic.drive svg { animation: drive-in .9s cubic-bezier(.2, .7, .2, 1); }
.carpic.drive .wheel { animation: wheel-spin .9s cubic-bezier(.2, .7, .2, 1); }
@keyframes drive-in { from { transform: translateX(-30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes wheel-spin { from { transform: rotate(-540deg); } to { transform: none; } }
.swatches { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.swatches label { position: relative; cursor: pointer; display: inline-flex; }
.swatches input { position: absolute; opacity: 0; pointer-events: none; }
.swatches span { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); box-shadow: inset 0 -3px 5px rgba(0, 0, 0, .18); }
.swatches input:checked + span { outline: 2px solid var(--volt); outline-offset: 2px; }
.swatches input:focus-visible + span { outline: 2px solid var(--focus); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { .carpic.drive svg, .carpic.drive .wheel { animation: none; } }

/* summary */
.cluster { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 2fr); gap: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); overflow: hidden; }
.hero { padding: 24px; border-right: 1px solid var(--line); display: grid; align-content: center; gap: 6px; }
.hero .big { font-family: var(--f-display); font-size: 3.4rem; font-weight: 700; line-height: 1; letter-spacing: -.035em; color: var(--good); font-variant-numeric: tabular-nums; }
.hero .big.neg { color: var(--bad); }
.hero .sub { color: var(--muted); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 16px 18px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; gap: 2px; }
.stat:nth-child(3n) { border-right: 0; }
.stat:nth-last-child(-n+3) { border-bottom: 0; }
.stat b { font-family: var(--f-display); font-size: 1.45rem; font-weight: 650; line-height: 1.15; letter-spacing: -.02em; }
.stat small { color: var(--muted); font-size: .8rem; }
.stat.v b { color: var(--volt); } .stat.f b { color: var(--fuel); }
.bstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.bstats .stat { border-bottom: 0; border-right: 1px solid var(--line); }
.bstats .stat:last-child { border-right: 0; }
.stat b.good { color: var(--good); } .stat b.warn { color: var(--fuel); } .stat b.bad { color: var(--bad); }

/* per-100 bars */
.per100 { display: grid; gap: 10px; padding: 20px 24px; background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); }
.bar-row { display: grid; grid-template-columns: 70px minmax(0, 1fr) 92px; gap: 10px; align-items: center; }
.bar-track { height: 12px; background: var(--bg); border-radius: 6px; overflow: hidden; }
.bar { height: 100%; border-radius: 6px; transition: width 500ms var(--ease-out); }
.bar.v { background: var(--volt); } .bar.f { background: var(--fuel); }
.bar-row .num { text-align: right; font-family: var(--f-mono); font-size: .88rem; }

/* chart */
.panel { background: var(--surface); box-shadow: var(--shadow); border-radius: var(--radius); padding: 20px 22px; display: grid; gap: 14px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; }
.legend { display: flex; gap: 14px; font-size: .85rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
#chart { width: 100%; height: auto; display: block; }
#chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.empty { color: var(--muted); padding: 18px 0; }

/* two-col area */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 320px); gap: 22px; align-items: start; }
.grid2.single { grid-template-columns: minmax(0, 1fr); }

/* form */
form { display: grid; gap: 12px; }
/* Each field takes three shared rows (label, box, hint) so boxes line up even when a label wraps or a hint is missing. */
.fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 4px 12px; align-items: start; }
.field { display: grid; grid-row: span 3; grid-template-rows: subgrid; gap: 4px; min-width: 0; margin-bottom: 8px; }
.field label { align-self: end; }
.field input, .field select { height: 38px; }
@supports not (grid-template-rows: subgrid) {
  .field { grid-row: auto; grid-template-rows: none; align-content: start; }
  .field label { min-height: 2.6em; display: flex; align-items: flex-end; }
}
.field label { font-size: .78rem; color: var(--muted); font-weight: 500; }
.field input { width: 100%; padding: 8px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); font-family: var(--f-mono); font-size: .95rem;
  transition: border-color 140ms ease, box-shadow 140ms ease; }
.field input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
.field .hint { font-size: .72rem; color: var(--muted); }
.fieldset-title { font-size: .72rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted); font-weight: 600; grid-column: 1 / -1; margin-top: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 15px; border-radius: 10px; cursor: pointer; font-weight: 600;
  transition: transform 140ms var(--ease-out), background-color 140ms ease, border-color 140ms ease; }
.btn.primary { background: var(--volt); color: var(--surface); border-color: var(--volt); }
.btn.small { padding: 4px 10px; font-size: .8rem; font-weight: 550; border-radius: 9px; }
/* Press feedback the moment a finger or click lands. */
.btn:active, .icon-btn:active, .place-chip:active, .month-toggle:active, .shape-opt:active, .look-icon:active, .look-colour:active, .cmp-chips label:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; transform: none; }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: var(--surface); border-color: var(--bad); }
.msg { font-size: .85rem; color: var(--muted); }
.msg.err { color: var(--bad); }
.preview { font-size: .85rem; color: var(--muted); font-family: var(--f-mono); }

/* table */
.table-wrap { overflow-x: auto; margin: 0 -20px; padding: 0 20px; }
table { width: 100%; border-collapse: collapse; font-size: .88rem; }
th { text-align: right; font-weight: 600; font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td { text-align: right; padding: 6px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; font-family: var(--f-mono); font-size: .8rem; }
table.log { min-width: 0; }
.month-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 2px; border: 0; border-radius: 6px; background: none; font: inherit; color: inherit; cursor: pointer; }
.month-toggle svg { width: 16px; height: 16px; color: var(--muted); transition: transform .2s ease; }
.month-toggle[aria-expanded="false"] svg { transform: rotate(-90deg); }
.month-count { font-family: var(--f-body); font-size: .78rem; font-weight: 500; color: var(--muted); margin-left: 4px; }
@media (prefers-reduced-motion: reduce) { .month-toggle svg { transition: none; } }
.icon-btn { display: inline-grid; place-items: center; width: 28px; height: 28px; padding: 0; border-radius: 8px; border: 1px solid color-mix(in srgb, currentColor 45%, transparent); background: transparent; cursor: pointer;
  transition: transform 140ms var(--ease-out), background-color 140ms ease; }
.icon-btn svg { width: 14px; height: 14px; }
.icon-btn.edit { color: var(--focus); }
.icon-btn.del { color: var(--bad); }
.icon-btn.del.armed { background: var(--bad); border-color: var(--bad); }
.icon-btn.del.armed svg { stroke: var(--surface); }
@media (max-width: 1000px) { table.log:not(.custom) .opt { display: none; } }
.lookpop .checks { width: min(320px, calc(100vw - 42px)); grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 640px) { table.log { min-width: 600px; } }
td.v { color: var(--volt); } td.f { color: var(--fuel); } td.s { color: var(--good); font-weight: 500; } td.s.neg { color: var(--bad); }
td.dim { color: var(--muted); }
tr.month td { font-family: var(--f-display); font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; text-align: left; border-bottom: 1px solid var(--line); padding-top: 18px; color: var(--ink); }
tr.total td { font-weight: 600; background: var(--bg); border-bottom: 2px solid var(--line); }
tr.total td.s { background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
tr.editing td { background: var(--volt-soft); }
.soc { display: inline-flex; align-items: center; gap: 4px; }
.soc .arrow { color: var(--volt); }
.row-actions { display: flex; gap: 4px; justify-content: flex-end; }

/* year overview */
.minis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.mini-chart { margin: 0; display: grid; gap: 6px; min-width: 0; }
.mini-chart svg { width: 100%; height: auto; display: block; }
.mini-chart text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
.mini-chart text.val { fill: var(--ink); }

/* warning in the entry form, credit line */
div.warn { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 12px; border: 1px solid var(--fuel); border-radius: 10px;
  background: color-mix(in srgb, var(--fuel) 14%, var(--surface)); color: var(--ink); font-size: .88rem; }
.warn[hidden] { display: none; }
.credit { text-align: center; font-size: .8rem; color: var(--muted); padding-block: 4px 8px; }
.credit strong { color: var(--ink); font-weight: 600; }
td .calc-mark { color: var(--muted); }

/* car type fields in the car form */
.carform select { max-width: 100%; }
.inline-lbl { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); }
.carfixed { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; flex-basis: 100%; }
.carfixed input { width: 9rem; font-family: var(--f-mono); }
.hero .big.f { color: var(--fuel); }

/* fuel logbook */
table.logf { min-width: 760px; }
td.full-yes { color: var(--good); } td.full-no { color: var(--muted); }

/* compare cars */
.cmp-km { width: 6.5rem; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); font-family: var(--f-mono); text-align: right; }
.cmp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.cmp-chips label { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 6px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer; font-size: .85rem; }
.cmp-chips label:has(input:checked) { border-color: var(--volt); background: var(--volt-soft); }
.cmp-chips input { accent-color: var(--volt); }
.cmp-chips .chipcar { display: inline-flex; width: 46px; height: 18px; }
.cmp-chips .chipcar svg { width: 100%; height: 100%; overflow: visible; }
table.cmp { min-width: 0; }
table.cmp th { text-transform: none; letter-spacing: 0; font-family: var(--f-display); font-size: .95rem; color: var(--ink); white-space: normal; vertical-align: bottom; }
table.cmp th small { display: block; font-family: var(--f-body); font-size: .72rem; color: var(--muted); font-weight: 500; }
table.cmp th.k-ev { box-shadow: inset 0 -3px 0 var(--volt); }
table.cmp th.k-fuel { box-shadow: inset 0 -3px 0 var(--fuel); }
table.cmp td:first-child { font-family: var(--f-body); font-size: .85rem; color: var(--muted); }
table.cmp tr.strong td { font-weight: 600; color: var(--ink); }
table.cmp td.best { color: var(--good); }
.chip-best { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); font: 600 .72rem var(--f-body); }
.cmp-bars { display: grid; gap: 8px; }
.cmp-bar-row { display: grid; grid-template-columns: minmax(0, 10rem) minmax(0, 1fr) 6.5rem; gap: 10px; align-items: center; font-size: .85rem; }
.cmp-bar-row .num { text-align: right; font-family: var(--f-mono); }
.cmp-track { display: flex; height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; }
.cmp-track span { height: 100%; }
.seg-ev { background: var(--volt); } .seg-fuel { background: var(--fuel); } .seg-fix { background: var(--muted); opacity: .45; }
.place-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.place-chip { display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 13px; border: 1px solid color-mix(in srgb, var(--volt) 40%, transparent); border-radius: 999px; background: var(--volt-soft); color: var(--ink); cursor: pointer; font-weight: 600; font-size: .85rem;
  transition: transform 140ms var(--ease-out), border-color 140ms ease; }
.place-chip small { font-family: var(--f-mono); font-weight: 500; color: var(--muted); }
.place-tag { display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 999px; background: var(--volt-soft); color: var(--volt); font: 600 .7rem var(--f-body); }
.placefields { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
table.places td:first-child { color: var(--ink); font-weight: 600; }
.finlist { display: grid; gap: 8px; }
.finrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.finrow:last-child { border-bottom: 0; }
.finrow .nm { font-weight: 600; flex: 1 1 9rem; min-width: 0; }
.finrow input, .finrow select { padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); max-width: 100%; }
.finrow input { width: 9.5rem; font-family: var(--f-mono); }
.finrow .fin-res { flex-basis: 100%; }
.seg-dep { background: repeating-linear-gradient(135deg, var(--muted) 0 3px, transparent 3px 6px); opacity: .7; }
.warn-chip { display: inline-block; margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--fuel) 18%, transparent); color: var(--fuel); font: 600 .72rem var(--f-body); }
.cmp-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.cmp-legend i { display: inline-block; width: 12px; height: 8px; border-radius: 3px; margin-right: 5px; vertical-align: middle; }
@media (max-width: 520px) { .cmp-bar-row { grid-template-columns: minmax(0, 1fr) 5.5rem; } .cmp-bar-row .cmp-track { grid-column: 1 / -1; grid-row: 2; } }

/* CSV import */
.import-bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 10px 12px; border: 1px solid var(--volt); border-radius: 10px; background: var(--volt-soft); }
.import-bar[hidden] { display: none; }

/* charging map */
#mapUi { display: grid; gap: 10px; }
#mapUi[hidden] { display: none; }
.map-controls { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 12px; }
.map-controls .field { grid-row: auto; grid-template-rows: none; margin: 0; width: 13rem; max-width: 100%; }
.map-controls .field:nth-child(2) { width: 7rem; }
.map-check { display: flex; align-items: center; gap: 6px; padding-bottom: 8px; cursor: pointer; }
.map-check input { accent-color: var(--volt); width: 16px; height: 16px; }
.dot-leg { display: inline-block; width: 10px; height: 10px; border-radius: 50%; vertical-align: middle; margin-right: 5px; }
#map { position: relative; z-index: 0; height: 420px; max-height: 70vh; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
#map.dark .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.92); }
#map .leaflet-popup-content-wrapper, #map .leaflet-popup-tip { background: var(--surface); color: var(--ink); }
#map .leaflet-popup-content { margin: 10px 12px; font: 13px/1.45 var(--f-body); display: grid; gap: 2px; }
#map .leaflet-popup-content strong { font-family: var(--f-display); font-size: 1.05rem; }
#map .pop-sub { color: var(--muted); }
#map .pop-links { display: flex; gap: 12px; margin-top: 6px; }
#map .pop-links a { color: var(--focus); font-weight: 600; }
#map .leaflet-control-attribution { background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--muted); }
#map .leaflet-control-attribution a { color: var(--focus); }

/* full cost table */
table.costs { min-width: 520px; }
table.costs td:first-child { font-family: var(--f-body); font-size: .9rem; }
table.costs input { width: 7rem; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-family: var(--f-mono); font-size: .85rem; text-align: right; }
td.pos { color: var(--good); } td.neg2 { color: var(--bad); }

/* comparison settings */
.settings .fields { grid-template-columns: 1fr 1fr; }
.field.wide { grid-column: 1 / -1; }
.regionsel { padding: 5px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); font-weight: 600; max-width: 100%; min-width: 0; }
.regionprices, .autofields { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.field .hint a { color: var(--focus); }
.field select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.calc { font-family: var(--f-mono); font-size: .82rem; color: var(--muted); background: var(--bg); border-radius: 8px; padding: 10px 12px; line-height: 1.6; }
.calc b { color: var(--ink); font-weight: 500; }

@media (max-width: 860px) {
  .cluster { grid-template-columns: minmax(0, 1fr); }
  .hero { border-right: 0; border-bottom: 1px solid var(--line); }
  .grid2 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 520px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stat:nth-child(3n) { border-right: 1px solid var(--line); }
  .stat:nth-child(2n) { border-right: 0; }
  .stat:nth-last-child(-n+3) { border-bottom: 1px solid var(--line); }
  .stat:nth-last-child(-n+2) { border-bottom: 0; }
  .hero .big { font-size: 3rem; }
  .bar-row { grid-template-columns: 54px minmax(0, 1fr) 84px; }
  .bstats { grid-template-columns: minmax(0, 1fr); }
  .minis { grid-template-columns: minmax(0, 1fr); }
  .bstats .stat { border-right: 0; border-bottom: 1px solid var(--line); }
  .bstats .stat:last-child { border-bottom: 0; }
}
@media (prefers-reduced-motion: reduce) { .bar { transition: none; } .lookpop { transition: opacity 180ms ease; } }
/* Hover only where there is a real pointer: on touch screens a tap would leave the hover stuck. */
@media (hover: hover) and (pointer: fine) {
  .btn:hover { border-color: var(--muted); }
  .btn.primary:hover { background: color-mix(in srgb, var(--volt) 88%, #fff); border-color: color-mix(in srgb, var(--volt) 88%, #fff); }
  .pref-toggle:hover .label { color: var(--ink); }
  .look-icon:hover { border-color: var(--line); background: var(--bg); }
  .look-colour:hover { box-shadow: 0 0 0 2px var(--volt); }
  .shape-opt:hover { border-color: var(--muted); }
  .month-toggle:hover { background: var(--bg); }
  .icon-btn:hover { background: color-mix(in srgb, currentColor 12%, transparent); }
  .place-chip:hover { border-color: var(--volt); }
}

/* Phone view (Settings → View): the narrow phone layout on any screen. Mirrors the max-width rules above. */
:root[data-layout="phone"] .wrap { max-width: 430px; }
:root[data-layout="phone"] .wrap > .w-half { grid-column: 1 / -1; }
:root[data-layout="phone"] .cluster { grid-template-columns: minmax(0, 1fr); }
:root[data-layout="phone"] .hero { border-right: 0; border-bottom: 1px solid var(--line); }
:root[data-layout="phone"] .grid2 { grid-template-columns: minmax(0, 1fr); }
:root[data-layout="phone"] .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
:root[data-layout="phone"] .stat:nth-child(3n) { border-right: 1px solid var(--line); }
:root[data-layout="phone"] .stat:nth-child(2n) { border-right: 0; }
:root[data-layout="phone"] .stat:nth-last-child(-n+3) { border-bottom: 1px solid var(--line); }
:root[data-layout="phone"] .stat:nth-last-child(-n+2) { border-bottom: 0; }
:root[data-layout="phone"] .hero .big { font-size: 3rem; }
:root[data-layout="phone"] .bar-row { grid-template-columns: 54px minmax(0, 1fr) 84px; }
:root[data-layout="phone"] .bstats { grid-template-columns: minmax(0, 1fr); }
:root[data-layout="phone"] .bstats .stat { border-right: 0; border-bottom: 1px solid var(--line); }
:root[data-layout="phone"] .bstats .stat:last-child { border-bottom: 0; }
:root[data-layout="phone"] .minis { grid-template-columns: minmax(0, 1fr); }
:root[data-layout="phone"] .prefs-grid { grid-template-columns: minmax(0, 1fr); }
:root[data-layout="phone"] table.log:not(.custom) .opt { display: none; }
:root[data-layout="phone"] table.log { min-width: 600px; }

/* Start animation: plug and nozzle cross like crossed bones, bolt and fuel shoot out, then "Plug / or / Pump". */
.intro { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: var(--bg); cursor: pointer; transition: opacity .45s ease;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.intro.out { opacity: 0; pointer-events: none; }
/* Held at the first frame until the page is really on screen (the viewer may load it out of sight). */
.intro:not(.play) * { animation-play-state: paused !important; }
.intro-art { width: min(420px, 84vw); max-height: 84vh; height: auto; overflow: visible; }
.intro-art text { font-family: var(--f-display); font-weight: 700; }
.intro .i-t { font-size: 72px; letter-spacing: .01em; }
.intro .i-t1 { fill: var(--volt); }
.intro .i-t2 { fill: var(--fuel); }
.intro .i-or text { font-size: 26px; fill: var(--muted); font-weight: 600; }
.intro-skip { position: absolute; left: 0; right: 0; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); text-align: center; font-size: .8rem; color: var(--muted); }
.intro .i-plug, .intro .i-pump { animation: i-slide .7s cubic-bezier(.2, .8, .2, 1) both; }
.intro .i-pump { animation-delay: .12s; }
.intro .i-bolt { transform-box: fill-box; transform-origin: 50% 100%; animation: i-bolt .6s .7s both; }
.intro .i-drop { transform-box: fill-box; transform-origin: 50% 100%; animation: i-drop .45s ease-out both; }
.intro .i-t1, .intro .i-t2 { transform-box: fill-box; animation: i-rise .55s cubic-bezier(.2, .8, .2, 1) both; }
.intro .i-t1 { animation-delay: 1.05s; }
.intro .i-t2 { animation-delay: 1.45s; }
.intro .i-or { transform-box: fill-box; transform-origin: center; animation: i-pop .45s 1.25s cubic-bezier(.3, 1.6, .5, 1) both; }
@keyframes i-slide { from { transform: translateY(160px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes i-bolt { 0% { transform: scale(.3, 0); opacity: 0; } 40% { transform: scale(1.12, 1.18); opacity: 1; } 55% { opacity: .35; } 70% { opacity: 1; } 82% { opacity: .6; } 100% { transform: none; opacity: 1; } }
@keyframes i-drop { from { transform: translateY(46px) scale(.25); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes i-rise { from { transform: translateY(22px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes i-pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .intro * { animation: none !important; } }
</style>

      const paid = isNum(e.cost) ? e.cost : (isNum(e.kwh) ? e.kwh * price : null);
      // Consumption: trip computer value, or calculated from battery % used × battery size (per car setting);
      // each falls back to the other when it is missing.
      const consCalc = (isNum(used) && used > 0 && isNum(cap) && km) ? used / 100 * cap / km * 100 : null;
      const cons = calcMode ? (isNum(consCalc) ? consCalc : e.cons) : (isNum(e.cons) ? e.cons : consCalc);
      const consIsCalc = isNum(cons) && cons === consCalc && cons !== e.cons;
      const elec = (km && isNum(cons)) ? km * cons / 100 * lossF * price : (km ? null : 0);
      const ownPrice = entryFuelPrice(e);
      const petrolPrice = isNum(ownPrice) ? ownPrice : fallbackP;
      const petrol = km * cmpL * petrolPrice / 100;
      const saved = isNum(elec) ? petrol - elec : null;
      const level = isNum(e.after) ? e.after : (isNum(e.before) ? e.before : prevLevel);
      prevLevel = level;
      // Battery check: kWh into the battery = % added × capacity; capacity estimate = display kWh driven ÷ % used.
      const added = (isNum(e.before) && isNum(e.after) && e.after > e.before) ? e.after - e.before : null;
      const chargeLoss = (isNum(cap) && added && isNum(e.kwh)) ? e.kwh / (added / 100 * cap) - 1 : null;
      const capEst = (isNum(used) && used >= 20 && km && isNum(e.cons)) ? (km * e.cons / 100) / (used / 100) : null;
      return { ...e, cons, consDisplay: e.cons, consIsCalc, price, petrolPrice, km, charged, added, chargeLoss, capEst, used, paid, elec, petrol, saved, odo, level };
    });
  }

  function totals(rows) {

    for (const r of rows) {
      t.km += r.km; t.petrol += r.petrol;
      if (isNum(r.elec)) t.elec += r.elec;

      if (isNum(r.paid)) t.paid += r.paid;
      if (isNum(r.kwh)) { t.kwh += r.kwh; if (isNum(r.paid)) t.kwhPaid += r.kwh; }
      if (r.km && isNum(r.cons)) { t.consKm += r.km; t.consKwh += r.km * r.cons / 100; }
    }

  }

  /* ---------- rendering ---------- */
  function render() {
    paintFuel();

    const prof = cmpProfile(), cmpL = prof.L;

    $('sumPaid').textContent = has ? eur.format(tt.paid) : '–';

    const p100v = tt.consKm ? tt.elec / tt.consKm * 100 : (settings.price * 17);
    const p100f = tt.km ? tt.petrol / tt.km * 100 : cmpL * fuelDefault();
    const mx = Math.max(p100v, p100f) || 1;
    $('barV').style.width = (p100v / mx * 100) + '%';
    $('barF').style.width = (p100f / mx * 100) + '%';
    $('per100V').textContent = eur.format(toU('per100', p100v));
    $('per100F').textContent = eur.format(toU('per100', p100f));

    renderBattery(rows);
    renderPlaces(rows, tt);
    renderYear(rows, tt);
    fillCosts(); paintCosts();
    renderChart(rows);
    renderTable(rows);
    renderSettingsCalc();
    updatePreview();
  }

  let measuredLoss = null;
  function renderBattery(rows) {
    const cap = carObj().capacity;
    const setB = (id, text, cls) => { const el = $(id); el.textContent = text; el.className = cls || ''; };
    $('capNote').textContent = isNum(cap) ? t('capNote', { c: fmt(cap, 1) }) : '';
    measuredLoss = null;
    if (!isNum(cap)) {
      setB('bLoss', '–'); setB('bCap', '–'); setB('bHealth', '–');
      $('bLossSub').textContent = t('bNoCap');
      $('bCapSub').textContent = $('bHealthSub').textContent = ' ';
      $('useLoss').hidden = true; return;
    }
    let kin = 0, kch = 0, n1 = 0, kd = 0, pu = 0, n2 = 0;
    for (const r of rows) {
      if (r.chargeLoss !== null) { kch += r.kwh; kin += r.added / 100 * cap; n1++; }
      if (r.capEst !== null) { kd += r.km * r.consDisplay / 100; pu += r.used; n2++; }
    }
    if (n1) {

    } else { setB('bLoss', '–'); $('bLossSub').textContent = t('bLossNeed'); }
    if (n2) {
      const est = kd / pu * 100, health = est / cap * 100;
      setB('bCap', fmt(est, 1) + ' ' + t('uKwh'));
      $('bCapSub').textContent = t('bCapSub', { n: n2 });
      setB('bHealth', fmt(Math.min(health, 100), 0) + ' %', health >= 95 ? 'good' : health >= 85 ? 'warn' : 'bad');
      $('bHealthSub').textContent = t('bHealthSub', { c: fmt(cap, 1) });

  });

  function niceStep(max, n) {
    const raw = max / n; const p = Math.pow(10, Math.floor(Math.log10(raw)));
    const m = raw / p; return (m <= 1 ? 1 : m <= 2 ? 2 : m <= 5 ? 5 : 10) * p;
  }
  // Chart colours: the viewer's picks (hex) from Settings, else the theme colours.

  function chartCol(k) {

  }
  function renderChart(rows) {

    if (pts.length < 2) { svg.innerHTML = ''; svg.hidden = true; $('chartEmpty').hidden = false; return; }
    svg.hidden = false; $('chartEmpty').hidden = true;
    const W = 680, H = 240, L = 52, R = 70, T = 14, B = 30;
    const maxX = ck, yStep = niceStep(cp, 4), maxY = Math.ceil(cp / yStep) * yStep || 1;
    const x = (v) => L + v / maxX * (W - L - R);
    const y = (v) => T + (1 - v / maxY) * (H - T - B);
    let out = '';
    for (let v = 0; v <= maxY + 1e-9; v += yStep) {
      out += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
      out += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${curN(v, 0)}</text>`;
    }
    const xStep = niceStep(maxX, 5);
    for (let v = 0; v <= maxX + 1e-9; v += xStep) {
      out += `<text x="${x(v)}" y="${H - 8}" text-anchor="middle">${fmt(v, 0)}</text>`;
    }
    out += `<text x="${W - R + 6}" y="${H - 8}" text-anchor="start">${t('uKm')}</text>`;
    const lineP = pts.map((p) => `${x(p.km)},${y(p.p)}`).join(' ');
    const lineE = pts.map((p) => `${x(p.km)},${y(p.e)}`).join(' ');

    out += `<polygon points="${area}" fill="${cA || 'var(--volt-soft)'}" fill-opacity="${cA ? '.35' : '1'}" stroke="none"/>`;
    out += `<polyline points="${lineP}" fill="none" stroke="${cP}" stroke-width="2.5" stroke-linejoin="round"/>`;
    out += `<polyline points="${lineE}" fill="none" stroke="${cE}" stroke-width="2.5" stroke-linejoin="round"/>`;
    const last = pts[pts.length - 1];
    out += `<circle cx="${x(last.km)}" cy="${y(last.p)}" r="4" fill="${cP}"/><circle cx="${x(last.km)}" cy="${y(last.e)}" r="4" fill="${cE}"/>`;
    let ly1 = y(last.p) + 4, ly2 = y(last.e) + 4;
    if (ly2 - ly1 < 14) ly2 = ly1 + 14;
    out += `<text x="${x(last.km) + 8}" y="${ly1}" style="fill:${cP}">${eur.format(last.p)}</text>`;
    out += `<text x="${x(last.km) + 8}" y="${ly2}" style="fill:${cE}">${eur.format(last.e)}</text>`;
    svg.innerHTML = out;
  }

  function cell(v, d, suffix, cls) { return `<td class="${cls || ''}">${isNum(v) ? fmt(v, d) + (suffix || '') : '<span class="dim">–</span>'}</td>`; }
  function money(v, cls) { return `<td class="${cls || ''}">${isNum(v) ? eur.format(v) : '<span class="dim">–</span>'}</td>`; }
  function price(v, d, cls) { return `<td class="${cls || ''}">${isNum(v) ? curN(v, d) : '<span class="dim">–</span>'}</td>`; } // per-unit prices (€/kWh, €/L) with set decimals

  // Folded months are a per-browser convenience, remembered per car.
  const collapsed = new Set((() => { try { return JSON.parse(localStorage.getItem('pop-collapsed')) || []; } catch (e) { return []; } })());
  function toggleMonth(key) {
    const k = currentCar + '|' + key;
    if (collapsed.has(k)) collapsed.delete(k); else collapsed.add(k);
    try { localStorage.setItem('pop-collapsed', JSON.stringify([...collapsed])); } catch (e) {}

    const b = document.querySelector('.month-toggle[data-month="' + key + '"]'); if (b) b.focus();
  }
  function renderTable(rows) {

    $('logEmpty').hidden = rows.length > 0;
    $('logCount').textContent = rows.length ? (rows.length === 1 ? t('entries1') : t('entriesN', { n: rows.length })) : '';
    const cmpL = cmpProfile().L;
    let html = '';
    for (const g of monthGroups(rows)) {
      const [yy, mm] = g.key.split('-');
      const open = !collapsed.has(currentCar + '|' + g.key);
      html += `<tr class="month"><td colspan="15"><button class="month-toggle" type="button" data-month="${g.key}" aria-expanded="${open}" title="${t(open ? 'collapse' : 'expand')}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg><span>${months[+mm - 1] || ''} ${yy || ''}</span>${open ? '' : `<span class="month-count">${g.rows.length === 1 ? t('entries1') : t('entriesN', { n: g.rows.length })}</span>`}</button></td></tr>`;
      for (const r of g.rows) {
        const battery = (isNum(r.before) || isNum(r.after))
          ? `<span class="soc">${isNum(r.before) ? fmt(r.before, 0) + '%' : '–'}${isNum(r.after) ? ' <span class="arrow">→</span> ' + fmt(r.after, 0) + '%' : ''}</span>` : '<span class="dim">–</span>';
        html += `<tr data-id="${r.id}" class="${r.id === editingId ? 'editing' : ''}"${open || r.id === editingId ? '' : ' hidden'}>
          <td>${dDate(r.date || '----')}</td><td>${battery}${PLACES.includes(r.place) ? `<span class="place-tag">${esc(placeName(r.place))}</span>` : ''}</td>
          ${cell(r.used, 0, ' %')}${cell(r.kwh, 2)}${money(r.paid)}${price(r.charged || isNum(r.kwh) ? r.price : null, 2, 'opt')}${cell(r.chargeLoss !== null ? r.chargeLoss * 100 : null, 0, ' %', 'opt')}
          ${cell(toU('dist', r.km) || null, 0)}${r.consIsCalc ? `<td title="${t('consSrcCalc')}"><span class="calc-mark">≈</span> ${fmt(toU('kwh100', r.cons), 1)}</td>` : cell(toU('kwh100', r.cons), 1)}${price(r.km ? toU('perL', r.petrolPrice) : null, 3, 'f opt')}
          ${money(r.km ? r.elec : null, 'v')}${money(r.km ? r.petrol : null, 'f')}${money(r.km ? r.saved : null, 's' + (r.saved < 0 ? ' neg' : ''))}
          ${cell(toU('dist', r.odo), 0)}
          <td><div class="row-actions"><button class="icon-btn edit" data-act="edit" type="button" title="${t('edit')}" aria-label="${t('edit')}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 2.5v11M2.5 8h11"/></svg></button><button class="icon-btn del" data-act="del" type="button" title="${t('del')}" aria-label="${t('del')}"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/></svg></button></div></td>
        </tr>`;
      }
      const s = totals(g.rows);
      html += `<tr class="total"><td>${t('monthTotal')}</td><td></td><td></td>${cell(s.kwh || null, 2)}${money(s.paid || null)}<td class="opt"></td><td class="opt"></td>${cell(toU('dist', s.km) || null, 0)}${cell(s.consKm ? toU('kwh100', s.consKwh / s.consKm * 100) : null, 1)}${price(s.km ? toU('perL', s.petrol / s.km * 100 / cmpL) : null, 3, 'f opt')}${money(s.elec, 'v')}${money(s.petrol, 'f')}${money(s.saved, 's')}${cell(toU('dist', g.rows[g.rows.length - 1].odo), 0)}<td></td></tr>`;
    }
    body.innerHTML = html;
  }

  /* ---------- year overview, monthly charts, CO2 ---------- */
  const CO2_GRID = 0.38; // kg CO2 per kWh of German grid mix; per-litre values are in FUELS
  const dayDiff = (a, b) => (Date.parse(b) - Date.parse(a)) / 86400000;
  let yearEnergy = null;
  function monthGroups(rows) {
    const groups = [];
    for (const r of rows) {
      const key = (r.date || '').slice(0, 7);
      let g = groups[groups.length - 1];
      if (!g || g.key !== key) { g = { key, rows: [] }; groups.push(g); }
      g.rows.push(r);
    }
    return groups;
  }
  function barChart(svg, items, fmtV, color) {
    items = items.filter((i) => isNum(i.value)).slice(-12);
    if (!items.length) { svg.innerHTML = `<text x="160" y="80" text-anchor="middle">${t('mEmpty')}</text>`; return; }
    const W = 320, H = 150, L = 6, R = 6, T = 22, B = 26;
    const max = Math.max(0, ...items.map((i) => i.value)), min = Math.min(0, ...items.map((i) => i.value));
    const span = (max - min) || 1;
    const y = (v) => T + (max - v) / span * (H - T - B);
    const slot = (W - L - R) / Math.max(items.length, 6), bw = Math.min(38, slot * 0.62);
    let out = `<line x1="${L}" x2="${W - R}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)" stroke-width="1"/>`;
    items.forEach((it, i) => {
      const cx = L + slot * (i + 0.5), y0 = y(0), y1 = y(it.value);
      const top = Math.min(y0, y1), h = Math.max(1, Math.abs(y1 - y0));
      out += `<rect x="${cx - bw / 2}" y="${top}" width="${bw}" height="${h}" rx="3" fill="${color}"/>`;
      out += `<text class="val" x="${cx}" y="${top - 6}" text-anchor="middle">${fmtV(it.value)}</text>`;
      out += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${it.label}</text>`;
    });
    svg.innerHTML = out;
  }
  function renderYear(rows, tt) {
    const span = rows.length > 1 ? Math.max(0, dayDiff(rows[0].date, rows[rows.length - 1].date)) : 0;
    const days = span >= 7 ? span : null;
    $('yearNote').textContent = span ? t('yearNote', { d: fmt(span, 0) }) : '';
    let co2 = 0;
    const cmpL = cmpProfile().L, fuelCo2 = FUELS[fuelKey()].co2, lossF = 1 + (settings.loss || 0) / 100;
    for (const r of rows) {
      if (!r.km) continue;
      co2 += r.km * cmpL / 100 * fuelCo2;
      if (isNum(r.cons)) co2 -= r.km * r.cons / 100 * lossF * CO2_GRID;
    }
    yearEnergy = days ? { e: tt.elec / days * 365, p: tt.petrol / days * 365 } : null;
    const yf = $('yFore');
    if (days) {
      yf.textContent = eur.format(tt.saved / days * 365); yf.className = tt.saved >= 0 ? 'good' : 'bad';
      $('yForeSub').textContent = t('yForeSub', { km: fmt(Math.round(toU('dist', tt.km) / days * 365 / 100) * 100, 0) });
      $('yMonth').textContent = eur.format(tt.saved / days * 30.44);
      $('yMonthSub').textContent = t('yPerMonthSubKm', { km: fmt(Math.round(toU('dist', tt.km) / days * 30.44 / 10) * 10, 0) });
    } else {
      yf.textContent = '–'; yf.className = ''; $('yMonth').textContent = '–';
      $('yForeSub').textContent = $('yMonthSub').textContent = t('yNeedWeek');
    }
    $('yCo2').textContent = tt.km ? fmt(toU('mass', co2), 0) + kgU() : '–';
    $('yCo2Sub').textContent = t('yCo2Sub', { y: days ? fmt(Math.round(toU('mass', co2) / days * 365 / 10) * 10, 0) : '–', p: fmt(toU('co2L', FUELS[fuelKey()].co2), 2), g: fmt(toU('mass', CO2_GRID), 2) });
    const short = t('months').split(',').map((m) => m.slice(0, 3));
    const groups = monthGroups(rows).map((g) => ({ label: short[+g.key.slice(5, 7) - 1] || '', s: totals(g.rows) }));
    barChart($('mSaved'), groups.map((g) => ({ label: g.label, value: g.s.km ? g.s.saved : null })), (v) => curN(v, 0), 'var(--good)');
    barChart($('mCons'), groups.map((g) => ({ label: g.label, value: g.s.consKm ? toU('kwh100', g.s.consKwh / g.s.consKm * 100) : null })), (v) => fmt(v, 1), 'var(--volt)');
    $('mSaved').setAttribute('aria-label', t('mSaved')); $('mCons').setAttribute('aria-label', t('mCons'));
  }

  /* ---------- full cost per year ---------- */
  const COST_EV = { ins: 'cEvIns', tax: 'cEvTax', maint: 'cEvMaint', thg: 'cEvThg' };
  const COST_P = { ins: 'cPIns', tax: 'cPTax', maint: 'cPMaint' };
  function fillCosts() {
    if (document.activeElement && document.activeElement.closest('#costBody')) return;
    const f = carObj().fixed || {}, pf = cmpProfile().fixed;
    for (const k in COST_EV) $(COST_EV[k]).value = toField(f[k]);
    for (const k in COST_P) $(COST_P[k]).value = toField(pf[k]);
  }
  function readCosts() {
    const ev = {}, p = {};
    for (const k in COST_EV) ev[k] = parseNum($(COST_EV[k]).value) || 0;
    for (const k in COST_P) p[k] = parseNum($(COST_P[k]).value) || 0;
    return { ev, p };
  }
  function paintCosts() {
    const { ev, p } = readCosts();
    const put = (id, v, cls) => { const el = $(id); el.textContent = isNum(v) ? eur.format(v) : '–'; el.className = cls || ''; };
    const dc = (v) => !isNum(v) || Math.abs(v) < 0.005 ? '' : v > 0 ? 'pos' : 'neg2';
    const e = yearEnergy;
    put('ceE', e ? e.e : null, 'v'); put('ceP', e ? e.p : null, 'f'); put('ceD', e ? e.p - e.e : null, dc(e ? e.p - e.e : null));
    put('cdIns', p.ins - ev.ins, dc(p.ins - ev.ins)); put('cdTax', p.tax - ev.tax, dc(p.tax - ev.tax));

  function buildWheel(box, look, onLive, onDone) {
    box.classList.add('wheelpop');
    let { h, s, v } = hexToHsv(hexOf(look.color));
    box.append(mk('div', 'pop-title', t('chooseColour')));
    const disc = mk('div', 'wheel-disc'); disc.tabIndex = 0; disc.setAttribute('role', 'slider');
    disc.setAttribute('aria-label', t('chooseColour'));
    const shade = mk('div', 'wheel-shade'), dot = mk('span', 'wheel-dot');
    disc.append(shade, dot);
    const row = mk('div', 'wheel-row');
    const range = mk('input'); range.type = 'range'; range.min = '8'; range.max = '100'; range.id = 'wheelV';
    range.value = String(Math.round(v * 100)); range.setAttribute('aria-label', t('brightness'));
    const now = mk('span', 'wheel-now');
    row.append(mk('span', 'msg', t('brightness')), range, now);
    box.append(disc, row);
    const paint = () => {
      const hex = hsvToHex(h, s, v), rad = h * Math.PI / 180;
      shade.style.opacity = String(1 - v);
      dot.style.left = (50 + Math.sin(rad) * s * 50) + '%';
      dot.style.top = (50 - Math.cos(rad) * s * 50) + '%';
      dot.style.background = hex; now.style.background = hex;
      disc.setAttribute('aria-valuetext', hex);

    };
    const fromPoint = (ev) => {
      const r = disc.getBoundingClientRect();
      const dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
      s = Math.min(1, Math.hypot(dx, dy) / (r.width / 2));

    };
    let dragging = false;
    disc.addEventListener('pointerdown', (ev) => { dragging = true; disc.setPointerCapture(ev.pointerId); fromPoint(ev); ev.preventDefault(); });
    disc.addEventListener('pointermove', (ev) => { if (dragging) fromPoint(ev); });
    const end = () => { if (!dragging) return; dragging = false; onDone(paint()); };
    disc.addEventListener('pointerup', end); disc.addEventListener('pointercancel', end);
    disc.addEventListener('keydown', (ev) => {
      const k = ev.key;
      if (k === 'ArrowLeft' || k === 'ArrowRight') h = (h + (k === 'ArrowRight' ? 10 : -10) + 360) % 360;
      else if (k === 'ArrowUp' || k === 'ArrowDown') s = Math.max(0, Math.min(1, s + (k === 'ArrowUp' ? 0.1 : -0.1)));

    });
    disc.addEventListener('keyup', (ev) => { if (ev.key.startsWith('Arrow')) onDone(paint()); });
    range.addEventListener('input', () => { v = +range.value / 100; onLive(paint()); });
    range.addEventListener('change', () => { v = +range.value / 100; onDone(paint()); });
    paint();
  }

  function renderFuelTable(rows) {

  /* ---------- compare cars side by side ---------- */
  // Electric car figures in the same shape as fuelStats.
  function evStats(car) {
    const lossF = 1 + (settings.loss || 0) / 100;
    const rows = compute(entriesOf(car.id), car), tt = totals(rows);
    const s = { km: tt.km, cons: null, priceE: null, per100: null, co2_100: null, days: 0 };
    if (tt.consKm) {
      s.cons = tt.consKwh / tt.consKm * 100;
      s.per100 = tt.elec / tt.consKm * 100;
      s.priceE = tt.elec / (tt.consKwh * lossF);
      s.co2_100 = s.cons * lossF * CO2_GRID;
    }
    s.days = rows.length > 1 ? Math.max(0, (Date.parse(rows[rows.length - 1].date) - Date.parse(rows[0].date)) / 86400000) : 0;
    return s;
  }
  const CMP_KEY = 'pop-compare'; // chosen cars and km per year stay on this device
  function cmpCfg() { try { return JSON.parse(localStorage.getItem(CMP_KEY)) || {}; } catch (e) { return {}; } }

  const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch]);
  function cmpDefaultKm() {
    for (const c of carList()) {
      if (isFuelCar(c)) continue;

  }
  function cmpColumns(kmYear) {
    const cols = [];

      }
    }

      cols.push({ id: '__virtualEv', car: null, name: t('cmpVirtualEv'), kind: 'ev', type: t('kindEv') + ' · ' + t('settingsBased'), km: null, days: null,

    const anyFin = cols.some((c) => isNum(c.fin));

      ? (c.finUsed ? '' : '<span class="dim">') + eur.format(c.fin) + ' <small class="dim">' + esc(t(c.finMode === 'lease' ? 'mDepLease' : 'mDepBuy')) + '</small>' + (c.finUsed ? '' : '</span>')
      : '<span class="dim">–</span>');
    row(t('mTotalYear'), (c) => val(c, c.ok ? eur.format(c.totalYear) + (c.totalYear === best && okCols.length > 1 ? `<span class="chip-best">${esc(t('cheapest'))}</span>` : '') : null), 'strong');
    row(t('mPerKm'), (c) => val(c, c.ok ? curN(c.totalYear / toU('dist', kmYear), 2) : null));
    row(t('mDiff'), (c) => !c.ok || okCols.length < 2 ? '<span class="dim">–</span>' : c.totalYear === best ? '–' : '+' + eur.format(c.totalYear - best));
    row(t('mCo2_100'), (c) => isNum(c.co2_100) ? fmt(toU('co2_100', c.co2_100), 1) + kgU() : '<span class="dim">–</span>');
    row(t('mCo2Year'), (c) => isNum(c.co2Year) ? fmt(toU('mass', c.co2Year), 0) + kgU() : '<span class="dim">–</span>');

    // Bars: total per year, split into energy and fixed costs.

  /* ---------- backup & restore: every car, entry and setting in one JSON file ---------- */
  const ID_RE = /^[A-Za-z0-9_\-.~:@+]{1,200}$/;
  let bkData = null;
  function bkSay(k, v, err) { $('bkMsg').textContent = k ? t(k, v) : ''; $('bkMsg').className = 'msg' + (err ? ' err' : ''); }
  $('bkSave').addEventListener('click', async () => {
    const data = {
      app: 'plug-or-pump', version: APP_VERSION, exported: new Date().toISOString(),
      settings, ui: { lang: ui.lang, theme: ui.theme, hidden: ui.hidden || [], hiddenCols: ui.hiddenCols, chartColors: ui.chartColors, units: ui.units, currency: ui.currency },
      cars: cars.map((c) => ({ ...c })), entries: entries.map((e) => ({ ...e }))
    };
    const json = JSON.stringify(data, null, 1), filename = 'plug-or-pump-backup-' + today() + '.json';
    try { bkSay(await saveFile(filename, json, 'application/json') === 'copied' ? 'bkCopied' : 'bkSaved'); }
    catch (e) { const no = e && e.code === 'declined'; bkSay(no ? 'csvDeclined' : 'bkFail', null, !no); }
  });
  $('bkLoad').addEventListener('click', () => { $('bkFile').value = ''; $('bkFile').click(); });

    const f = $('bkFile').files && $('bkFile').files[0]; if (!f) return;
    bkSay(null);
    let obj = null;
    try { obj = JSON.parse(await f.text()); } catch (e) { obj = null; }
    if (!obj || obj.app !== 'plug-or-pump' || !Array.isArray(obj.cars) || !Array.isArray(obj.entries)) { bkData = null; $('bkBar').hidden = true; bkSay('bkBad', null, true); return; }
    bkData = obj;
    $('bkText').textContent = t('bkFound', { d: obj.exported ? dDate(String(obj.exported).slice(0, 10)) : '?', c: obj.cars.length, e: obj.entries.length });
    $('bkBar').hidden = false; $('bkReplace').classList.remove('armed'); $('bkReplace').textContent = t('bkReplace');
  });
  $('bkCancel').addEventListener('click', () => { bkData = null; $('bkBar').hidden = true; });
  async function restoreBackup(replace) {
    const obj = bkData; if (!obj) return;
    bkData = null;
    ['bkMerge', 'bkReplace', 'bkCancel'].forEach((id) => { $(id).disabled = true; });
    const strip = (o) => { const { id, ...rest } = o || {}; return [id, rest]; };
    const cl = obj.cars.filter((c) => c && typeof c === 'object'), el = obj.entries.filter((e) => e && typeof e === 'object');
    const total = cl.length + el.length;
    let i = 0;
    const step = () => { i++; $('bkText').textContent = t('bkBusy', { i, n: total }); };
    try {
      for (const c of cl) { const [id, d] = strip(c); await store.saveCar(ID_RE.test(id || '') ? id : 'car' + Date.now().toString(36) + i, d); step(); }
      for (const e of el) { const [id, d] = strip(e); await store.save(ID_RE.test(id || '') ? id : null, d); step(); }
      if (replace) {
        // Remove what the backup doesn't have.
        const keepCars = new Set(cl.map((c) => c.id)), keepEntries = new Set(el.map((e) => e.id));
        for (const e of [...entries]) if (!keepEntries.has(e.id)) await store.remove(e.id);
        for (const c of [...cars]) if (!keepCars.has(c.id)) await store.removeCar(c.id);

        await store.saveSettings({ ...obj.settings, ...settings }); // keep my settings, fill in what's missing
      }

      ['bkMerge', 'bkReplace', 'bkCancel'].forEach((id) => { $(id).disabled = false; });
      $('bkBar').hidden = true; renderCars(); render();

  /* ---------- charging places: Work / Home / Public AC / Public DC, each with its own price ---------- */

  // A place's price, or null when it was cleared (button hidden).

      const up = mk('button', 'icon-btn wmove', '↑'); up.type = 'button'; up.dataset.w = w; up.dataset.move = '-1'; up.disabled = i === 0;
      up.title = t('moveUp'); up.setAttribute('aria-label', t('w_' + w) + ': ' + t('moveUp'));
      const dn = mk('button', 'icon-btn wmove', '↓'); dn.type = 'button'; dn.dataset.w = w; dn.dataset.move = '1'; dn.disabled = i === order.length - 1;
      dn.title = t('moveDown'); dn.setAttribute('aria-label', t('w_' + w) + ': ' + t('moveDown'));
      const sz = mk('button', 'btn small wsize', t(half.has(w) ? 'sizeHalf' : 'sizeFull')); sz.type = 'button'; sz.dataset.w = w;
      sz.setAttribute('aria-pressed', String(half.has(w)));
      btns.append(up, dn, sz);
      row.append(lab, btns); box.append(row);
    });
  }
  /* logbook columns: hidden by position (nth-child), so month and total rows follow too */
  const LOG_COLS = [
    { k: 'battery', n: 2, l: () => t('thBattery') }, { k: 'used', n: 3, l: () => t('thUsed') },
    { k: 'kwh', n: 4, l: () => t('kwhCharged') }, { k: 'paid', n: 5, l: () => t('thPaid') },
    { k: 'price', n: 6, l: () => t('uEurKwh') }, { k: 'loss', n: 7, l: () => t('thLoss') },
    { k: 'km', n: 8, l: () => t('uKmCol') }, { k: 'cons', n: 9, l: () => t('uKwh100') },
    { k: 'superL', n: 10, l: () => fuelShort() + ' ' + t('uEurLs') }, { k: 'elec', n: 11, l: () => t('electric') + ' ' + cur() },
    { k: 'petrol', n: 12, l: () => fuelShort() + ' ' + cur() }, { k: 'saved', n: 13, l: () => t('saved') },
    { k: 'odo', n: 14, l: () => t('thOdo') }
  ];
  function applyCols() {
    const custom = Array.isArray(ui.hiddenCols);
    document.querySelector('table.log').classList.toggle('custom', custom);
    const hidden = new Set(custom ? ui.hiddenCols : []);
    $('colStyle').textContent = LOG_COLS.filter((c) => hidden.has(c.k)).map((c) => `table.log tr > :nth-child(${c.n}) { display: none; }`).join('\n');
  }
  function fillColChecks(box, prefix) {
    box.innerHTML = '';
    // Before any choice, the three detail columns count as hidden on narrow screens only; show them ticked.
    const hidden = new Set(Array.isArray(ui.hiddenCols) ? ui.hiddenCols : []);
    for (const c of LOG_COLS) {
      const lab = document.createElement('label');
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = prefix + '_' + c.k; cb.dataset.col = c.k; cb.checked = !hidden.has(c.k);
      const sp = document.createElement('span'); sp.textContent = c.l();
      lab.append(cb, sp); box.appendChild(lab);
    }
  }
  function colChange(el) {
    const box = el.closest('.checks');
    const hiddenCols = LOG_COLS.filter((c) => { const cb = box.querySelector('[data-col="' + c.k + '"]'); return cb && !cb.checked; }).map((c) => c.k);
    changeUI({ hiddenCols });
  }
  $('colsBtn').addEventListener('click', () => openPop($('colsBtn'), (box) => {
    box.append(mk('div', 'pop-title', t('logCols')));
    const g = mk('div', 'checks'); fillColChecks(g, 'pcol'); box.append(g);
    g.addEventListener('change', (ev) => { if (ev.target.dataset.col) colChange(ev.target); });
    const all = mk('button', 'btn small', t('showAll')); all.type = 'button';
    all.addEventListener('click', () => { changeUI({ hiddenCols: [] }); fillColChecks(g, 'pcol'); });
    box.append(all);
  }));

  function applyUI() {
    applyTheme(); applyText(); applyWidgets(); applyCols(); paintPrefs(); renderCars(); fillSettingsForm(); render();
  }
  let uiSaveTimer = null;
  function changeUI(patch) {
    ui = { ...ui, ...patch };
    try { localStorage.setItem('pop-ui', JSON.stringify(ui)); } catch (e) {}
    applyUI();
    clearTimeout(uiSaveTimer);
    uiSaveTimer = setTimeout(async () => {
      if (!store) return;
      try {
        const d = { lang: ui.lang, theme: ui.theme, hidden: ui.hidden || [] };
        if (Array.isArray(ui.hiddenCols)) d.hiddenCols = ui.hiddenCols;
        if (ui.chartColors) d.chartColors = ui.chartColors;
        if (Array.isArray(ui.wOrder)) d.wOrder = ui.wOrder;
        if (Array.isArray(ui.wHalf)) d.wHalf = ui.wHalf;
        if (ui.units) d.units = ui.units;
        if (ui.currency) d.currency = ui.currency;
        await store.saveUi(d);
      }
      catch (e) { carMsg(t('errPrefs'), true); }
    }, 400);
  }
  $('prefsBtn').addEventListener('click', () => {
    const open = $('prefs').hidden;
    $('prefs').hidden = !open; $('prefsBtn').setAttribute('aria-expanded', String(open));
    if (open) $('prefs').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });
  $('prefsClose').addEventListener('click', () => { $('prefs').hidden = true; $('prefsBtn').setAttribute('aria-expanded', 'false'); $('prefsBtn').focus(); });
  // Section layout buttons: move up / down, full / half width.
  $('widgetChecks').addEventListener('click', (ev) => {
    const b = ev.target.closest('button'); if (!b) return;
    const w = b.dataset.w, order = widgetOrder();
    if (b.dataset.move) {
      const i = order.indexOf(w), j = i + Number(b.dataset.move);
      if (j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      changeUI({ wOrder: order });
    } else {
      const half = new Set(ui.wHalf || []);
      if (half.has(w)) half.delete(w); else half.add(w);
      changeUI({ wHalf: [...half] });
    }
    const sel = b.dataset.move ? `.wmove[data-w="${w}"][data-move="${b.dataset.move}"]` : `.wsize[data-w="${w}"]`;
    const again = $('widgetChecks').querySelector(sel);
    if (again && !again.disabled) again.focus();
  });
  $('prefs').addEventListener('change', (ev) => {
    const el = ev.target;
    if (el.name === 'lang') changeUI({ lang: el.value });
    else if (el.name === 'theme') changeUI({ theme: el.value });
    else if (el.name === 'units') changeUI({ units: el.value });
    else if (el.id === 'currencySel') changeUI({ currency: el.value });
    else if (el.name === 'layout') {
      ui = { ...ui, layout: el.value };
      try { localStorage.setItem('pop-ui', JSON.stringify(ui)); } catch (e) {}
      applyLayout(); render();
    }
    else if (el.id === 'finInclude') { const cfg = cmpCfg(); cfg.dep = el.checked; saveCmpCfg(cfg); renderCompare(); }
    else if (el.id === 'autoOnOpen') { const c = autoCfg(); c.onOpen = el.checked; saveAutoCfg(c); }
    else if (el.id === 'introOn') {
      ui = { ...ui, intro: el.checked };
      try { localStorage.setItem('pop-ui', JSON.stringify(ui)); } catch (e) {}
    }
    else if (el.dataset && el.dataset.col) {
      colChange(el);
      const again = $('sc_' + el.dataset.col); if (again) again.focus();
    }
    else if (el.type === 'checkbox' && el.id.startsWith('w_') && !el.id.startsWith('w_size')) {
      const hidden = WIDGETS.filter((w) => !$('w_' + w).checked);
      changeUI({ hidden });
      const again = $('w_' + el.value); if (again) again.focus();
    }
  });

  /* ---------- boot ---------- */
  function attach(s) {
    store = s;
    s.subscribe(
      (list) => { entries = list; renderCars(); render(); },
      (st) => { settings = { ...DEFAULTS, ...(st || {}) }; fillSettingsForm(); paintFormLabels(); paintPlaceUi(); paintPrefs(); render(); },
      (list) => { cars = list.sort((a, b) => (a.created || 0) - (b.created || 0)); renderCars(); render(); },
      (u) => {
        if (!u) return;
        const next = { lang: u.lang || 'en', theme: u.theme || 'system', hidden: Array.isArray(u.hidden) ? u.hidden : [] };
        if (Array.isArray(u.hiddenCols)) next.hiddenCols = u.hiddenCols;
        if (u.chartColors && typeof u.chartColors === 'object') next.chartColors = u.chartColors;
        if (Array.isArray(u.wOrder)) next.wOrder = u.wOrder;
        if (Array.isArray(u.wHalf)) next.wHalf = u.wHalf;
        if (u.units === 'us' || u.units === 'metric') next.units = u.units;
        if (CURRENCIES.includes(u.currency)) next.currency = u.currency;
        const cur = { lang: ui.lang, theme: ui.theme, hidden: ui.hidden || [] };
        if (Array.isArray(ui.hiddenCols)) cur.hiddenCols = ui.hiddenCols;
        if (ui.chartColors) cur.chartColors = ui.chartColors;
        if (Array.isArray(ui.wOrder)) cur.wOrder = ui.wOrder;
        if (Array.isArray(ui.wHalf)) cur.wHalf = ui.wHalf;
        if (ui.units) cur.units = ui.units;
        if (ui.currency) cur.currency = ui.currency;
        if (JSON.stringify(next) === JSON.stringify(cur)) return;
        ui = { ...next, layout: ui.layout, intro: ui.intro };
        try { localStorage.setItem('pop-ui', JSON.stringify(ui)); } catch (e) {}
        applyUI();
      }
    );
  }
  // For tests.html: the pure calculation and parsing functions (they change no data).
  window.__pop = { version: APP_VERSION, parseNum, csvNum, csvDate, splitCsv, parseImport, parseImportFuel, entryKey, compute, computeFuel, today, toU, fromU, curN, setCurrency: (c) => { ui.currency = c; eur = newMoneyFmt(); }, setLang: (l) => { ui.lang = l; }, setUnits: (u) => { ui.units = u; },
    knownKeys: (list) => { const keep = entries; entries = list; try { return [...knownKeys(false)]; } finally { entries = keep; } } };
  applyTheme(); applyText(); applyWidgets(); applyCols(); paintPrefs();
  renderCars(); resetForm(); resetFuelForm(); fillSettingsForm(); render(); paintCarPic(true);
  (async () => {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
    if (db) { setStatus('', 'stLoading'); attach(dbStore(db)); }
    else { setStatus('warn', 'stLocal'); attach(localStore()); }
  })();
  (async () => {
    try { downloadsApi = window.claude && window.claude.use ? await window.claude.use('downloads') : null; } catch (e) { downloadsApi = null; }
  })();
  // Home-screen app (hosted copy only): works offline via sw.js, and asks the browser not to clear the saved data.
  (async () => {
    if (window.claude || !window.isSecureContext) return;
    try { if ('serviceWorker' in navigator) await navigator.serviceWorker.register('sw.js'); } catch (e) {} // no sw.js next to the file: stays an ordinary page
    try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
  })();
  // Automatic prices on open: downloaded copy only, at most every 3 hours, quietly.
  setTimeout(() => {
    const c = autoCfg(), a = (regionsObj()[regionKey()] || {}).auto;
    if (!inClaude() && c.onOpen && c.key && (!a || Date.now() - a.at > 3 * 3600000)) fetchPrices(true);
  }, 1500);
})();
</script>
