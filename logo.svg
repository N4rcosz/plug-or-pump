<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Plug Or Pump app logo: the start animation's crossed charging plug and fuel nozzle. Full square; iOS rounds the corners. -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#1d3d38"/>
      <stop offset="1" stop-color="#0b0f0f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(257 294) scale(1.25)">
    <!-- charging plug, pointing up-right -->
    <g transform="rotate(40) translate(0 -95)">
      <path d="M0 200 C0 236 -30 250 -62 262" fill="none" stroke="#e8efed" stroke-width="10" stroke-linecap="round"/>
      <rect x="-21" y="95" width="42" height="110" rx="14" fill="#3ccbb5"/>
      <path d="M-12 122h24M-12 136h24M-12 150h24" stroke="#0b0f0f" stroke-opacity=".35" stroke-width="3" stroke-linecap="round"/>
      <rect x="-31" y="20" width="62" height="84" rx="20" fill="#3ccbb5"/>
      <rect x="-26" y="14" width="52" height="34" rx="14" fill="#0e1716"/>
      <circle cx="-12" cy="28" r="4.5" fill="#e8efed"/><circle cx="0" cy="24" r="4.5" fill="#e8efed"/><circle cx="12" cy="28" r="4.5" fill="#e8efed"/>
      <circle cx="-6" cy="39" r="3.5" fill="#e8efed"/><circle cx="6" cy="39" r="3.5" fill="#e8efed"/>
      <polygon points="7,8 -16,-52 1,-52 -12,-112 20,-40 3,-40 15,8" fill="#ffd84a" stroke="#0e1716" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <!-- fuel nozzle, pointing up-left -->
    <g transform="rotate(-40) translate(0 -95)">
      <path d="M0 205 C0 240 30 252 62 262" fill="none" stroke="#e8efed" stroke-width="10" stroke-linecap="round"/>
      <rect x="-5" y="12" width="10" height="64" rx="4" fill="#93a3a0"/>
      <rect x="-7" y="10" width="14" height="9" rx="3" fill="#e8efed"/>
      <rect x="-34" y="70" width="68" height="50" rx="10" fill="#f2a649"/>
      <rect x="-17" y="112" width="34" height="96" rx="12" fill="#f2a649"/>
      <path d="M17 124q26 6 20 52" fill="none" stroke="#e8efed" stroke-width="5" stroke-linecap="round"/>
      <path d="M-10 138h20M-10 152h20M-10 166h20" stroke="#0b0f0f" stroke-opacity=".3" stroke-width="3" stroke-linecap="round"/>
      <g transform="translate(0 -6)"><path d="M0 -12C7 -3 10 2 10 7A10 10 0 0 1 -10 7C-10 2 -7 -3 0 -12Z" fill="#f2a649"/></g>
      <g transform="translate(0 -40) scale(.85)"><path d="M0 -12C7 -3 10 2 10 7A10 10 0 0 1 -10 7C-10 2 -7 -3 0 -12Z" fill="#f2a649"/></g>
      <g transform="translate(-4 -72) scale(.7)"><path d="M0 -12C7 -3 10 2 10 7A10 10 0 0 1 -10 7C-10 2 -7 -3 0 -12Z" fill="#f2a649"/></g>
    </g>
  </g>
</svg>
