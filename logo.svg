<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Plug Or Pump app logo, liquid glass (as the app): half leaf (electric, teal) and half fuel drop (petrol, amber)
       made of tinted glass over soft blurred light, a bright rim where light catches the edge, a bolt across.
       Full square, no text; iOS rounds the corners itself. -->
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="90"/></filter>
    <filter id="hl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000" flood-opacity=".42"/>
    </filter>
    <filter id="bolt" x="-40%" y="-30%" width="180%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".3"/>
    </filter>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6ff0da" stop-opacity=".88"/>
      <stop offset="1" stop-color="#119c87" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="fuel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc977" stop-opacity=".9"/>
      <stop offset="1" stop-color="#dc7f16" stop-opacity=".82"/>
    </linearGradient>
    <!-- glass sheen: light from above, gone by the middle -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- rim light: bright at the top edge, fading down the sides -->
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="boltfill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#e6f6f2"/>
    </linearGradient>
    <!-- right half: the drop (tip 512,170; circle centre 512,610, r 250) down to its lowest point -->
    <path id="drop" d="M512 170 L717.8 468.1 A250 250 0 0 1 512 860 Z"/>
    <!-- left half: a leaf from the same tip, wider in the middle and tapering to a point at the bottom -->
    <path id="leaf" d="M512 170 C 410 250 262 400 262 590 C 262 735 380 820 512 860 Z"/>
    <!-- the whole outline, for the sheen and the rim -->
    <path id="outline" d="M512 170 L717.8 468.1 A250 250 0 0 1 512 860 C 380 820 262 735 262 590 C 262 400 410 250 512 170 Z"/>
    <clipPath id="leafclip"><use href="#leaf"/></clipPath>
    <clipPath id="outlineclip"><use href="#outline"/></clipPath>
  </defs>

  <!-- backdrop: the app's blurred teal, blue and amber light under a dark veil -->
  <rect width="1024" height="1024" fill="#090c0c"/>
  <g filter="url(#soft)">
    <circle cx="230" cy="230" r="330" fill="#11796a"/>
    <circle cx="760" cy="300" r="240" fill="#323a8f"/>
    <circle cx="820" cy="840" r="330" fill="#8a4c10"/>
  </g>
  <rect width="1024" height="1024" fill="#080a0a" fill-opacity=".38"/>

  <g transform="translate(512 525) scale(1.1) translate(-512 -525)"> <!-- glyph fills the icon grid -->
    <!-- tinted glass -->
    <g filter="url(#lift)">
      <use href="#leaf" fill="url(#volt)"/>
      <use href="#drop" fill="url(#fuel)"/>
    </g>
    <!-- leaf veins from the middle line, angled up and out like a real leaf -->
    <g clip-path="url(#leafclip)" fill="none" stroke="#0b6458" stroke-opacity=".4" stroke-width="16" stroke-linecap="round">
      <path d="M512 780 Q 420 740 330 650"/>
      <path d="M512 640 Q 420 600 320 500"/>
      <path d="M512 500 Q 440 460 380 370"/>
    </g>
    <!-- sheen, a faint seam where the two halves meet, and the bright rim (drawn inside the edge) -->
    <use href="#outline" fill="url(#sheen)"/>
    <!-- specular highlight where light catches the curved glass, upper left -->
    <g clip-path="url(#outlineclip)">
      <ellipse cx="400" cy="400" rx="70" ry="170" transform="rotate(32 400 400)" fill="#fff" fill-opacity=".22" filter="url(#hl)"/>
    </g>
    <line x1="512" y1="176" x2="512" y2="856" stroke="#fff" stroke-opacity=".22" stroke-width="4"/>
    <use href="#outline" fill="none" stroke="url(#rim)" stroke-width="14" clip-path="url(#outlineclip)"/>
    <polygon points="566,330 436,592 512,592 470,792 606,520 528,520 586,330" fill="url(#boltfill)" filter="url(#bolt)"/>
  </g>
</svg>
