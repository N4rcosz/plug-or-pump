<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Plug Or Pump app logo: half leaf (electric, teal) and half fuel drop (petrol, amber), joined at the middle, a bolt across.
       Full square, no text, no fine lines, so it reads at home-screen size; iOS rounds the corners itself. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e4740"/>
      <stop offset="1" stop-color="#0a1311"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fe0cb"/>
      <stop offset="1" stop-color="#16a58f"/>
    </linearGradient>
    <linearGradient id="fuel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc06a"/>
      <stop offset="1" stop-color="#e2861c"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- right half: the drop (tip 512,170; circle centre 512,610, r 250) down to its lowest point -->
    <path id="drop" d="M512 170 L717.8 468.1 A250 250 0 0 1 512 860 Z"/>
    <!-- left half: a leaf from the same tip, wider in the middle and tapering to a point at the bottom -->
    <path id="leaf" d="M512 170 C 410 250 262 400 262 590 C 262 735 380 820 512 860 Z"/>
    <clipPath id="leafclip"><use href="#leaf"/></clipPath>
    <filter id="bolt" x="-30%" y="-20%" width="160%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g transform="translate(512 525) scale(1.1) translate(-512 -525)"> <!-- glyph fills the icon grid -->
    <g filter="url(#lift)">
      <use href="#leaf" fill="url(#volt)"/>
      <use href="#drop" fill="url(#fuel)"/>
    </g>
    <!-- leaf veins from the middle line, angled up and out like a real leaf -->
    <g clip-path="url(#leafclip)" fill="none" stroke="#0d7466" stroke-opacity=".45" stroke-width="16" stroke-linecap="round">
      <path d="M512 780 Q 420 740 330 650"/>
      <path d="M512 640 Q 420 600 320 500"/>
      <path d="M512 500 Q 440 460 380 370"/>
    </g>
    <!-- soft light from above, fading out by the middle -->
    <use href="#leaf" fill="url(#sheen)"/>
    <use href="#drop" fill="url(#sheen)"/>
    <polygon points="566,330 436,592 512,592 470,792 606,520 528,520 586,330" fill="#ffffff" filter="url(#bolt)"/>
  </g>
</svg>
